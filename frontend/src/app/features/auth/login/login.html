<div class="login-wrapper">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h1>HRFlow</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@company.com" />
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <span class="error">Enter a valid email</span>
      }
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <span class="error">Password must be at least 6 characters</span>
      }
    </div>

    @if (errorMessage()) {
      <div class="server-error">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</div>
